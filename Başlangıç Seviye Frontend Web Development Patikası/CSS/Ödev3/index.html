<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <!-- Üst Navigasyon -->
      <nav class="navbar">
        <ul class="nav-links">
          <li><a href="#">Gmail</a></li>
          <li><a href="#">Görseller</a></li>
          <li>
            <a href="#" class="apps-icon"
              ><img
                src="https://cdn-icons-png.flaticon.com/512/17/17704.png"
                alt="Google Uygulamaları"
            /></a>
          </li>
          <li><a href="#" class="profile-icon">A</a></li>
        </ul>
      </nav>

      <!-- Logo ve Arama Bölümü -->
      <div class="logo-section">
        <img
          src="https://www.google.com/images/branding/googlelogo/1x/googlelogo_color_272x92dp.png"
          alt="Google Logo"
          class="google-logo" />

        <div class="search-box">
          <div class="search-input">
            <img
              src="https://cdn-icons-png.flaticon.com/512/482/482631.png"
              alt="Arama İkonu"
              class="search-icon" />
            <input type="text" />
            <img
              src="https://cdn-icons-png.flaticon.com/512/3128/3128290.png"
              alt="Mikrofon"
              class="microphone-icon" />
          </div>
        </div>

        <div class="search-buttons">
          <button>Google'da Ara</button>
          <button>Kendimi Şanslı Hissediyorum</button>
        </div>

        <div class="languages">
          <p>
            Google'ı kullanabileceğiniz diğer diller: <a href="#">English</a>
          </p>
        </div>
      </div>

      <!-- Footer -->
      <footer>
        <div class="footer-top">
          <p>Türkiye</p>
        </div>
        <div class="footer-bottom">
          <div class="footer-left">
            <a href="#">Hakkında</a>
            <a href="#">Reklam</a>
            <a href="#">İşletme</a>
            <a href="#">Arama nasıl çalışır?</a>
          </div>
          <div class="footer-right">
            <a href="#">Gizlilik</a>
            <a href="#">Şartlar</a>
            <a href="#">Ayarlar</a>
          </div>
        </div>
      </footer>
    </div>
  </body>
</html>
